function videoPoster(src) {
    const cache = window.akaneVideoPosterCache ||= new Map();
    if (cache.has(src)) return cache.get(src);
    const promise = (async()=>{const cached=await window.NottonData?.getPoster?.(src);if(cached)return cached;return new Promise(resolve => {
        const probe = document.createElement('video');
        probe.muted = true;
        probe.playsInline = true;
        probe.preload = 'auto';
        let done = false;
        const finish = poster => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            probe.pause();
            probe.removeAttribute('src');
            probe.load();
            if(poster)window.NottonData?.putPoster?.(src,poster);resolve(poster);
        };
        const capture = () => {
            if (done || probe.readyState < 2 || !probe.videoWidth) return;
            try {
                const canvas = document.createElement('canvas');
                canvas.width = Math.min(960, probe.videoWidth);
                canvas.height = Math.max(1, Math.round(canvas.width * probe.videoHeight / probe.videoWidth));
                canvas.getContext('2d').drawImage(probe, 0, 0, canvas.width, canvas.height);
                finish(canvas.toDataURL('image/jpeg', 0.85));
            } catch { finish(''); }
        };
        const timer = setTimeout(() => finish(''), 20000);
        probe.addEventListener('error', () => finish(''), { once: true });
        probe.addEventListener('loadedmetadata', () => {
            const time = Number.isFinite(probe.duration) ? Math.min(1, probe.duration / 2) : 0;
            if (time > 0) {
                probe.addEventListener('seeked', capture, { once: true });
                probe.currentTime = time;
            } else {
                probe.addEventListener('loadeddata', capture, { once: true });
                capture();
            }
        }, { once: true });
        probe.src = src;
        probe.load();
    });
    })();
    cache.set(src, promise);
    return promise;
}
function makeMedia(src, label) {
    const isVideo = /^data:video\//i.test(src || '');
    const media = document.createElement(isVideo ? 'video' : 'img');
    if (isVideo) {
        media.controls = true;
        media.playsInline = true;
        media.preload = 'none';
        media.setAttribute('aria-label', label || 'Video preview');
        videoPoster(src).then(poster => {
            if (poster) media.poster = poster;
        });
    } else {
        media.alt = label || 'Preview';
        media.loading = 'lazy';
        media.decoding = 'async';
    }
    media.src = src;
    return media;
}

function drawOffers(expanded=false,selected=null){const available=offers.some(item=>item.status==='open');const toggle=query('.availability-toggle');toggle.dataset.on=String(available);query('.availability-label').textContent=available?'ON':'OFF';toggle.setAttribute('aria-label',available?'Available: ON':'Available: OFF');const target=query(expanded?'.offer-dialog-content':'.offer-list');target.replaceChildren();const visible=selected?[selected]:offers.filter(item=>item.status==='open'||item.status==='waitlist');if(!visible.length){const empty=document.createElement('div');empty.className='offer-empty';const title=document.createElement('h3');title.textContent='Coming soon';const text=document.createElement('p');text.textContent=language==='en'?'New commissions will appear here. Feel free to message me!':'รอใส่รายละเอียดคอมมิชชั่นที่เปิดรับ';empty.append(title,text);target.appendChild(empty);return;}visible.forEach(item=>{const card=document.createElement('article');card.className='offer-card';if(!expanded){const ribbon=document.createElement('span');ribbon.className='offer-ribbon';ribbon.setAttribute('aria-hidden','true');card.appendChild(ribbon);}const image=document.createElement('div');image.className='offer-image';const previews=item.images?.length?item.images:(item.cover?[item.cover]:[]);if(expanded&&previews.length){image.classList.add('offer-image-stack');previews.forEach((src,index)=>{const frame=document.createElement('div');frame.className='offer-detail-media';const media=makeMedia(src,item.title);applyCrop(media,item.crops?.[index]);frame.append(media);image.append(frame);});}else if(previews.length){let current=0;let img=makeMedia(previews[0],item.title);applyCrop(img,item.crops?.[0]);image.appendChild(img);if(previews.length>1){const controls=document.createElement('div');controls.className='preview-arrows row';const prev=document.createElement('button');prev.type='button';prev.textContent='‹';prev.setAttribute('aria-label','Previous preview');const next=document.createElement('button');next.type='button';next.textContent='›';next.setAttribute('aria-label','Next preview');const count=document.createElement('span');count.textContent=`1 / ${previews.length}`;const move=step=>{current=(current+step+previews.length)%previews.length;if(img.tagName==='VIDEO')img.pause();const replacement=makeMedia(previews[current],item.title);img.replaceWith(replacement);img=replacement;applyCrop(img,item.crops?.[current]);count.textContent=`${current+1} / ${previews.length}`;};prev.addEventListener('click',async ()=>move(-1));next.addEventListener('click',async ()=>move(1));controls.append(prev,count,next);image.appendChild(controls);}}else image.textContent='Commission preview';const content=document.createElement('div');content.className='offer-info';const status=document.createElement('span');status.className='pill';status.textContent=item.status==='waitlist'?'Waitlist':'Open';const title=document.createElement('h3');title.textContent=item.title;const price=document.createElement('p');price.className='offer-price';price.textContent=`Price ฿${Number(item.price).toLocaleString()}`;const detail=document.createElement('p');detail.className='offer-description';detail.textContent=item.details;const included=document.createElement('div');included.className='offer-included';if(item.included){const label=document.createElement('h4');label.textContent="You'll get";const list=document.createElement('ul');item.included.split('\n').map(line=>line.trim()).filter(Boolean).forEach(text=>{const li=document.createElement('li');li.textContent=text.replace(/^[-•]\s*/, '');list.appendChild(li);});included.append(label,list);}const contact=document.createElement('a');contact.textContent=item.status==='waitlist'?'Join wait list':'Accept';contact.className='offer-cta';contact.dataset.status=item.status;contact.href=/^https?:\/\//i.test(item.link||'')?item.link:'';contact.target='_blank';contact.rel='noopener';if(expanded){content.append(status,title,price,detail,included,contact);const estimate=buildOfferEstimate(item);contact.before(estimate);}else{const preview=document.createElement('p');preview.className='offer-summary';preview.textContent=item.details;const view=document.createElement('button');view.type='button';view.className='cursor-interaction offer-view';view.textContent='View details';view.addEventListener('click',async ()=>{drawOffers(true,item);query('.offer-dialog').showModal();});content.append(status,title,price,preview,view,contact);}if(item.slots){const slots=document.createElement('p');slots.className='offer-slots';slots.textContent=`${item.slots} slots available`;const badges=document.createElement('div');badges.className='offer-badges row';status.replaceWith(badges);badges.append(status,slots);}const usage=document.createElement('div');usage.className='offer-usage';const check=document.createElement('span');check.setAttribute('aria-hidden','true');check.textContent='✓';const label=document.createElement('span');label.textContent=item.commercialAllowed?'Personal / Commercial Use':'Personal Use Only';usage.append(check,label);price.after(usage);card.append(image,content);target.appendChild(card);});}

function buildOfferEstimate(item){const panel=document.createElement('section');panel.className='offer-estimate';const title=document.createElement('h4');title.textContent='License scope';panel.appendChild(title);const choices=document.createElement('div');choices.className='row';let multiplier=1;const licenses=[];for(const [name,factor] of [['Personal Use',1],...(item.commercialAllowed?[['Commercial Use',2.5]]:[])]){const button=document.createElement('button');button.type='button';button.className='cursor-interaction';button.textContent=name+(factor===1?' · Included':' · ×2.5');button.setAttribute('aria-pressed',String(factor===1));button.addEventListener('click',async ()=>{multiplier=factor;licenses.forEach(entry=>entry.button.setAttribute('aria-pressed',String(entry.factor===factor)));update();});licenses.push({button,factor});choices.appendChild(button);}panel.appendChild(choices);const inputs=[];if(item.addons?.length){const heading=document.createElement('h4');heading.textContent='Add-ons';panel.appendChild(heading);item.addons.forEach(addon=>{const label=document.createElement('label');label.className='offer-addon';const name=document.createElement('span');name.textContent=`${addon.name} · +฿${Number(addon.price).toLocaleString()}`;const input=document.createElement('input');input.type='number';input.min='0';input.step='1';input.value='0';input.setAttribute('aria-label',addon.name+' quantity');input.addEventListener('input',update);label.append(name,input);inputs.push({input,price:Number(addon.price)});panel.appendChild(label);});}const total=document.createElement('output');total.className='offer-total';total.setAttribute('aria-live','polite');const note=document.createElement('p');note.className='small';note.textContent=language==='en'?'Base estimate. The final price depends on the details.':'ราคาประเมินเบื้องต้น อาจคิดเพิ่มตามรายละเอียดงานค่ะ';panel.append(total,note);function update(){const extras=inputs.reduce((sum,{input,price})=>sum+Math.max(0,Math.floor(Number(input.value)||0))*price,0);total.textContent=`Total ฿${((Number(item.price)+extras)*multiplier).toLocaleString()}`;}update();return panel;}

function drawWorkLibrary(){const target=query('.work-library');target.replaceChildren();const entries=orderedArtworkEntries(artworks);const pageCount=Math.max(1,Math.ceil(entries.length/10));workLibraryPage=Math.min(workLibraryPage,pageCount);entries.slice((workLibraryPage-1)*10,workLibraryPage*10).forEach(({art,index})=>{const row=document.createElement('div');row.className='offer-admin-bubble';const title=document.createElement('span');title.className='offer-admin-name';title.textContent=art.title;title.title=art.title;const edit=document.createElement('button');edit.type='button';edit.textContent='Edit';edit.className='cursor-interaction';edit.addEventListener('click',async ()=>{editingWork=index;query('.work-title').value=art.title;workType=art.typeId||'full';drawTaxonomy();query('.work-category').value=art.scale||art.tags[0];query('.work-finish').value=art.finish||art.tags[1];query('.publish').checked=true;showUploadMedia(art.image);workCrop=cropValue(art.crop);drawWorkCrop(art.image);query('.save').textContent='Save changes';query('.cancel-work-edit').hidden=false;query('.save-result').textContent='';query('.work-title').focus();});const remove=document.createElement('button');remove.type='button';remove.textContent='Delete';remove.className='cursor-interaction delete-work';remove.setAttribute('aria-label',`Delete ${art.title}`);remove.addEventListener('click',async ()=>{if(!window.confirm(`ลบผลงาน “${art.title}” ใช่ไหมคะ?`))return;const removed=artworks.splice(index,1)[0];if(!(await remember())){artworks.splice(index,0,removed);query('.save-result').textContent='ลบไม่สำเร็จ กรุณาลองอีกครั้งค่ะ';return;}if(editingWork===index)query('.cancel-work-edit').click();else if(editingWork>index)editingWork--;category='All';latestIndex=0;drawGallery();drawLatest();drawWorkLibrary();query('.save-result').textContent='ลบผลงานแล้วค่ะ';});const replace=document.createElement('button');replace.type='button';replace.textContent='🔁';replace.className='cursor-interaction replace-work-row';replace.setAttribute('aria-label',`Change media ${art.title}`);replace.addEventListener('click',async ()=>{edit.click();query('.upload input[type=file]').click();});const thumb=document.createElement('div');thumb.className='work-library-thumb';const visual=makeMedia(art.image,'');if(visual.tagName==='VIDEO')visual.controls=false;applyCrop(visual,art.crop);thumb.append(visual);row.append(thumb,title,edit,replace,remove);target.append(row);});if(pageCount>1){const pages=document.createElement('nav');pages.className='work-library-pages row';pages.setAttribute('aria-label','Artwork pages');for(let page=1;page<=pageCount;page++){const button=document.createElement('button');button.type='button';button.textContent=String(page);button.className='cursor-interaction';button.setAttribute('aria-label',`Artwork page ${page}`);button.setAttribute('aria-current',page===workLibraryPage?'page':'false');button.setAttribute('aria-pressed',String(page===workLibraryPage));button.addEventListener('click',async ()=>{workLibraryPage=page;drawWorkLibrary();});pages.append(button);}target.append(pages);}}

-sort-state small';state.textContent=index<10?'Showcase':'';const up=document.createElement('button');up.type='button';up.className='cursor-interaction showcase-move';up.textContent='↑';up.disabled=index===0;up.setAttribute('aria-label',`เลื่อน ${entry.art.title} ขึ้น`);up.addEventListener('click',()=>{moveShowcaseDraft(index,index-1);query('.showcase-sort-list').children[index-1]?.querySelector('.showcase-move')?.focus();});const down=document.createElement('button');down.type='button';down.className='cursor-interaction showcase-move';down.textContent='↓';down.disabled=index===showcaseDraft.length-1;down.setAttribute('aria-label',`เลื่อน ${entry.art.title} ลง`);down.addEventListener('click',()=>{moveShowcaseDraft(index,index+1);query('.showcase-sort-list').children[index+1]?.querySelector('.showcase-move')?.focus();});row.append(handle,order,thumb,title,state,up,down);list.append(row);});}
